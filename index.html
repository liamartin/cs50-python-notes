<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CS50's Introduction to Programming with Python — Study Notes</title>


<style>
/* ── CS50 DESIGN SYSTEM ─────────────────────────────── */
:root {
  --cs50-red:      #c0392b;
  --cs50-red-dark: #922b21;
  --cs50-red-lite: #f9ebea;
  --cs50-red-mid:  #e74c3c;
  --black:    #1a1a1a;
  --gray-900: #212529;
  --gray-700: #495057;
  --gray-500: #6c757d;
  --gray-300: #ced4da;
  --gray-200: #e9ecef;
  --gray-100: #f8f9fa;
  --white:    #ffffff;
  --font: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif;
  --mono: 'Courier New', Consolas, 'Lucida Console', monospace;
  --sidebar-w: 240px;
  --topbar-h: 52px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html { scroll-behavior: smooth; }

body {
  
  font-size: 15px;
  line-height: 1.7;
  color: var(--gray-900);
  background: var(--white);
}

/* ── TOP BAR ── */
.topbar {
  position: fixed;
  top: 0; left: 0; right: 0;
  height: var(--topbar-h);
  background: var(--cs50-red);
  display: flex;
  align-items: center;
  padding: 0 24px;
  z-index: 200;
  gap: 12px;
}
.topbar-logo {
  font-size: 18px;
  font-weight: 700;
  color: var(--white);
  letter-spacing: -0.3px;
  white-space: nowrap;
}
.topbar-logo span { font-weight: 300; opacity: 0.85; }
.topbar-sep { width: 1px; height: 20px; background: rgba(255,255,255,0.3); margin: 0 4px; }
.topbar-course { font-size: 13px; color: rgba(255,255,255,0.85); font-weight: 400; }
.topbar-right { margin-left: auto; font-size: 12px; color: rgba(255,255,255,0.65); font-style: italic; }

/* ── LAYOUT ── */
.layout {
  display: flex;
  padding-top: var(--topbar-h);
  min-height: 100vh;
}

/* ── SIDEBAR ── */
.sidebar {
  width: var(--sidebar-w);
  flex-shrink: 0;
  background: var(--gray-100);
  border-right: 1px solid var(--gray-300);
  position: fixed;
  top: var(--topbar-h);
  bottom: 0;
  left: 0;
  overflow-y: auto;
  scrollbar-width: thin;
  scrollbar-color: var(--gray-300) transparent;
}
.sidebar::-webkit-scrollbar { width: 4px; }
.sidebar::-webkit-scrollbar-thumb { background: var(--gray-300); border-radius: 2px; }

.sidebar-section { padding: 16px 0 8px; }
.sidebar-heading {
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--gray-500);
  padding: 0 18px 6px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 18px;
  cursor: pointer;
  border-left: 3px solid transparent;
  transition: background 0.12s, border-color 0.12s;
  text-decoration: none;
}
.nav-item:hover { background: var(--gray-200); }
.nav-item.active {
  background: var(--cs50-red-lite);
  border-left-color: var(--cs50-red);
}
.nav-num {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  background: var(--gray-300);
  color: var(--gray-700);
  font-size: 11px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: background 0.12s, color 0.12s;
}
.nav-item.active .nav-num { background: var(--cs50-red); color: var(--white); }
.nav-text { font-size: 13px; color: var(--gray-700); line-height: 1.3; }
.nav-sub  { font-size: 11px; color: var(--gray-500); }
.nav-item.active .nav-text { color: var(--cs50-red-dark); font-weight: 500; }

.sidebar-divider { height: 1px; background: var(--gray-300); margin: 8px 18px; }

/* ── MAIN ── */
.main {
  margin-left: var(--sidebar-w);
  flex: 1;
  padding: 44px 56px 80px;
  max-width: 820px;
}

.lecture { display: none; }
.lecture.active { display: block; animation: fadeIn 0.2s ease; }

@keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }

/* ── LECTURE HEADER ── */
.lec-week {
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--cs50-red);
  margin-bottom: 6px;
}
.lec-title {
  font-size: 32px;
  font-weight: 700;
  color: var(--black);
  line-height: 1.15;
  margin-bottom: 8px;
}
.lec-title em {
  font-style: italic;
  font-weight: 300;
  color: var(--gray-700);
}
.lec-topics {
  font-size: 13px;
  color: var(--gray-500);
  line-height: 1.6;
  margin-bottom: 8px;
}
.lec-desc {
  font-size: 15px;
  color: var(--gray-700);
  line-height: 1.75;
  margin-bottom: 28px;
  padding-bottom: 28px;
  border-bottom: 2px solid var(--cs50-red);
}

/* ── SECTION ── */
.section { margin-bottom: 32px; }
.section-title {
  font-size: 18px;
  font-weight: 700;
  color: var(--black);
  margin-bottom: 14px;
  padding-bottom: 6px;
  border-bottom: 1px solid var(--gray-200);
}
.section-sub {
  font-size: 14px;
  font-weight: 700;
  color: var(--gray-700);
  margin: 16px 0 8px;
}

/* ── ANALOGY ── */
.analogy {
  background: var(--cs50-red-lite);
  border-left: 4px solid var(--cs50-red);
  padding: 16px 20px;
  border-radius: 0 6px 6px 0;
  margin-bottom: 4px;
}
.analogy-label {
  font-size: 11px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--cs50-red);
  margin-bottom: 6px;
}
.analogy p { font-size: 14px; color: var(--gray-900); line-height: 1.7; }

/* ── CONCEPT CARDS ── */
.concept-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
  gap: 10px;
}
.concept-card {
  border: 1px solid var(--gray-300);
  border-radius: 6px;
  padding: 14px 16px;
  background: var(--white);
  transition: border-color 0.15s, box-shadow 0.15s;
}
.concept-card:hover { border-color: var(--cs50-red); box-shadow: 0 2px 8px rgba(192,57,43,0.08); }
.cc-icon { font-size: 20px; margin-bottom: 7px; }
.cc-name { font-size: 13px; font-weight: 700; color: var(--black); margin-bottom: 4px; }
.cc-desc { font-size: 12.5px; color: var(--gray-600, #6c757d); line-height: 1.55; }

/* ── CODE BLOCKS ── */
.code-wrap { margin-bottom: 6px; }
.code-header {
  display: flex;
  align-items: center;
  gap: 8px;
  background: #2d2d2d;
  border-radius: 6px 6px 0 0;
  padding: 8px 14px;
  border-bottom: 1px solid #444;
}
.code-dot { width: 10px; height: 10px; border-radius: 50%; }
.code-filename {
  font-family: var(--mono);
  font-size: 11px;
  color: #aaa;
  margin-left: 4px;
}
.code-label-text {
  font-size: 12px;
  color: var(--gray-500);
  margin-bottom: 6px;
  font-style: italic;
}
pre.code-block {
  background: #1e1e1e;
  border-radius: 0 0 6px 6px;
  padding: 16px 18px;
  font-family: var(--mono);
  font-size: 13px;
  line-height: 1.75;
  color: #d4d4d4;
  overflow-x: auto;
  white-space: pre;
  margin: 0;
}
/* Syntax tokens */
.t-kw  { color: #569cd6; }
.t-fn  { color: #dcdcaa; }
.t-str { color: #ce9178; }
.t-cmt { color: #6a9955; font-style: italic; }
.t-num { color: #b5cea8; }
.t-bi  { color: #4ec9b0; }

/* ── TABLES ── */
.table-wrap { overflow-x: auto; }
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 13.5px;
  margin-bottom: 4px;
}
thead { background: var(--gray-900); }
th {
  text-align: left;
  padding: 10px 14px;
  color: var(--white);
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
td {
  padding: 9px 14px;
  border-bottom: 1px solid var(--gray-200);
  color: var(--gray-700);
  vertical-align: top;
  line-height: 1.5;
}
tr:last-child td { border-bottom: none; }
tr:nth-child(even) td { background: var(--gray-100); }
td code, th code {
  font-family: var(--mono);
  font-size: 12px;
  background: rgba(0,0,0,0.07);
  padding: 1px 5px;
  border-radius: 3px;
  color: var(--cs50-red-dark);
}
.table-wrap { border: 1px solid var(--gray-300); border-radius: 6px; overflow: hidden; }

/* ── TIPS ── */
.tip {
  display: flex;
  gap: 12px;
  padding: 13px 16px;
  border-radius: 6px;
  margin-bottom: 8px;
  font-size: 14px;
  line-height: 1.6;
  border: 1px solid;
}
.tip.warn  { background: #fef9e7; border-color: #f9ca24; }
.tip.good  { background: #eafaf1; border-color: #27ae60; }
.tip.info  { background: #eaf4fb; border-color: #3498db; }
.tip.red   { background: var(--cs50-red-lite); border-color: var(--cs50-red); }
.tip-icon  { font-size: 17px; flex-shrink: 0; }
.tip-body  { color: var(--gray-700); }
.tip-body strong { color: var(--black); font-weight: 700; }
.tip-body code { font-family: var(--mono); font-size: 12px; background: rgba(0,0,0,0.06); padding: 1px 5px; border-radius: 3px; }

/* ── FLOWCHART ── */
.flow-container { overflow-x: auto; padding: 4px 0 8px; }
svg.flow { display: block; }

/* ── INTERACTIVE DEMO ── */
.demo-box {
  border: 1px solid var(--gray-300);
  border-radius: 6px;
  overflow: hidden;
}
.demo-topbar {
  background: var(--gray-900);
  color: var(--white);
  padding: 8px 14px;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.06em;
  text-transform: uppercase;
}
.demo-body { padding: 16px; background: var(--white); }
.demo-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; flex-wrap: wrap; }
.demo-lbl { font-size: 13px; color: var(--gray-700); font-weight: 500; }
input[type="number"] {
  border: 1px solid var(--gray-300);
  border-radius: 4px;
  padding: 5px 10px;
  font-family: var(--mono);
  font-size: 13px;
  width: 80px;
  color: var(--gray-900);
  outline: none;
}
input[type="number"]:focus { border-color: var(--cs50-red); box-shadow: 0 0 0 2px rgba(192,57,43,0.15); }
.demo-output {
  background: #1e1e1e;
  border-radius: 4px;
  padding: 12px 14px;
  font-family: var(--mono);
  font-size: 13px;
  color: #4ec9b0;
  min-height: 48px;
  white-space: pre-wrap;
  line-height: 1.7;
}
.btn-row { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
.btn {
  
  font-size: 12px;
  font-weight: 700;
  padding: 6px 14px;
  border-radius: 4px;
  border: 1px solid var(--gray-300);
  background: var(--white);
  color: var(--gray-700);
  cursor: pointer;
  transition: all 0.12s;
  letter-spacing: 0.02em;
}
.btn:hover { border-color: var(--cs50-red); color: var(--cs50-red); background: var(--cs50-red-lite); }
.btn.primary { background: var(--cs50-red); color: var(--white); border-color: var(--cs50-red); }
.btn.primary:hover { background: var(--cs50-red-dark); border-color: var(--cs50-red-dark); }

/* ── BREADCRUMB HEADER ── */
.bc { font-size: 12px; color: var(--gray-500); margin-bottom: 20px; }
.bc a { color: var(--cs50-red); text-decoration: none; }
.bc a:hover { text-decoration: underline; }
.bc-sep { margin: 0 6px; }

/* ── PROGRESS ── */
.progress-strip {
  position: fixed;
  top: var(--topbar-h);
  left: var(--sidebar-w);
  right: 0;
  height: 3px;
  background: var(--gray-200);
  z-index: 100;
}
.progress-fill {
  height: 100%;
  background: var(--cs50-red);
  transition: width 0.35s ease;
}

@media (max-width: 768px) {
  .sidebar { display: none; }
  .main { margin-left: 0; padding: 28px 20px 60px; }
  .progress-strip { left: 0; }
}
</style>
</head>
<body>

<!-- TOP BAR -->
<header class="topbar">
  <div class="topbar-logo">CS50<span>'s</span></div>
  <div class="topbar-sep"></div>
  <div class="topbar-course">Introduction to Programming with Python</div>
  <div class="topbar-right">Study Notes</div>
</header>

<!-- PROGRESS -->
<div class="progress-strip"><div class="progress-fill" id="prog" style="width:11%"></div></div>

<div class="layout">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <div class="sidebar-section">
      <div class="sidebar-heading">Weeks</div>
      <div id="nav-list"></div>
    </div>
  </aside>

  <!-- MAIN -->
  <main class="main">
    <div id="content"></div>
  </main>
</div>

<script>
/* ── DATA ──────────────────────────────────────────── */
const lectures = [
  {
    num: 0,
    title: "Functions, Variables",
    topics: "Functions · Arguments · Side Effects · Return Values · Variables · Scope · str · int · float · def · return",
    desc: "Python programs are built from functions — actions that do things — and variables that store data. This week introduces the core building blocks every Python program uses.",
    sections: [
      { type:"analogy", text:"Think of a function like a vending machine. You press a button (call the function), put in money (arguments), and a snack comes out (return value). The snack appearing is the <em>side effect</em> — something visible happening. The snack itself is the <em>return value</em> — a value handed back to you." },
      { type:"concepts", title:"Key Vocabulary", items:[
        { icon:"🔧", name:"Function", desc:"A named action or command. Calling it makes Python do something." },
        { icon:"📦", name:"Variable", desc:"A labelled container that stores a value you can reuse later." },
        { icon:"📥", name:"Argument", desc:"A value you pass into a function so it knows what to work on." },
        { icon:"📤", name:"Return value", desc:"The result a function hands back after completing its job." },
        { icon:"💬", name:"Side effect", desc:"Something a function does visibly, like printing to the screen." },
        { icon:"🔭", name:"Scope", desc:"Where a variable exists. Variables only live in the function that created them." },
      ]},
      { type:"flow", title:"How Python runs your code", steps:[
        {l:"You write\nHello.py",    fill:"#c0392b", tc:"#fff"},
        {l:"Run: python\nHello.py",  fill:"#2c3e50", tc:"#fff"},
        {l:"Interpreter\nreads file",fill:"#c0392b", tc:"#fff"},
        {l:"Translates\nto 0s & 1s", fill:"#2c3e50", tc:"#fff"},
        {l:"Output on\nscreen",      fill:"#27ae60", tc:"#fff"},
      ]},
      { type:"table", title:"Built-in functions to know", headers:["Function","What it does","Example"],
        rows:[
          ["<code>print()</code>","Displays text on screen","<code>print(\"Hello!\")</code>"],
          ["<code>input()</code>","Asks user to type something","<code>input(\"Name? \")</code>"],
          ["<code>int()</code>","Converts text to whole number","<code>int(\"5\")</code> → 5"],
          ["<code>float()</code>","Converts text to decimal","<code>float(\"3.14\")</code> → 3.14"],
          ["<code>str()</code>","Converts number to text","<code>str(42)</code> → \"42\""],
        ]
      },
      { type:"code", file:"greeting.py", label:"Getting user input and greeting them",
        code:`<span class="t-cmt"># Ask the user for their name and greet them</span>
name = <span class="t-fn">input</span>(<span class="t-str">"What is your name? "</span>)
<span class="t-fn">print</span>(<span class="t-str">"Nice to meet you,"</span>, name)

<span class="t-cmt"># Cleaner version using an f-string</span>
<span class="t-fn">print</span>(<span class="t-str">f"Nice to meet you, {name}!"</span>)`
      },
      { type:"code", file:"functions.py", label:"Writing your own function with a return value",
        code:`<span class="t-kw">def</span> <span class="t-fn">double</span>(n):
    <span class="t-kw">return</span> n * <span class="t-num">2</span>

<span class="t-kw">def</span> <span class="t-fn">square</span>(n):
    <span class="t-kw">return</span> n * n

result = <span class="t-fn">double</span>(<span class="t-num">7</span>)
<span class="t-fn">print</span>(<span class="t-str">"Double of 7 is"</span>, result)   <span class="t-cmt"># 14</span>
<span class="t-fn">print</span>(<span class="t-str">"5 squared is"</span>, <span class="t-fn">square</span>(<span class="t-num">5</span>))   <span class="t-cmt"># 25</span>`
      },
      { type:"tips", items:[
        { k:"warn",  icon:"⚠️", html:"<strong>= vs ==</strong> — A single <code>=</code> assigns a value. Double <code>==</code> checks equality. Never mix them up!" },
        { k:"warn",  icon:"⚠️", html:"<strong>Scope error</strong> — A variable created inside a function cannot be used outside of it. Pass values as arguments instead." },
        { k:"info",  icon:"💡", html:"<strong>f-strings</strong> are the cleanest way to embed variables in text: <code>f\"Hello, {name}!\"</code>" },
      ]},
    ]
  },
  {
    num: 1,
    title: "Conditionals",
    topics: "if · elif · else · Boolean Expressions · and · or · not · match",
    desc: "Conditionals let your program make decisions. Using <code>if</code>, <code>elif</code>, and <code>else</code>, you can run different code depending on what values the user provides or what conditions are true.",
    sections: [
      { type:"analogy", text:"Conditionals are like forks in a road. If it is raining, take the covered path. Otherwise, walk outside. Python's <em>if / elif / else</em> gives your program the same ability to choose different paths depending on any condition you define." },
      { type:"table", title:"Comparison operators", headers:["Symbol","Meaning","Example","Result"],
        rows:[
          ["<code>==</code>","Is equal to","<code>5 == 5</code>","True"],
          ["<code>!=</code>","Is not equal to","<code>3 != 4</code>","True"],
          ["<code>&gt;</code>","Greater than","<code>10 &gt; 3</code>","True"],
          ["<code>&lt;</code>","Less than","<code>2 &lt; 7</code>","True"],
          ["<code>&gt;=</code>","Greater than or equal","<code>5 &gt;= 5</code>","True"],
          ["<code>&lt;=</code>","Less than or equal","<code>4 &lt;= 6</code>","True"],
        ]
      },
      { type:"flow", title:"if / elif / else decision flow", steps:[
        {l:"Start",            fill:"#2c3e50", tc:"#fff"},
        {l:"if\ncondition?",   fill:"#c0392b", tc:"#fff"},
        {l:"Run if\nblock ✓",  fill:"#27ae60", tc:"#fff"},
        {l:"elif\ncondition?", fill:"#c0392b", tc:"#fff"},
        {l:"Run elif\nblock ✓",fill:"#27ae60", tc:"#fff"},
        {l:"else:\nfallback",  fill:"#7f8c8d", tc:"#fff"},
      ]},
      { type:"code", file:"temperature.py", label:"Temperature checker — if / elif / else in action",
        code:`temp = <span class="t-bi">int</span>(<span class="t-fn">input</span>(<span class="t-str">"Temperature in °C? "</span>))

<span class="t-kw">if</span> temp &gt; <span class="t-num">30</span>:
    <span class="t-fn">print</span>(<span class="t-str">"It's hot! Stay hydrated."</span>)
<span class="t-kw">elif</span> temp &gt; <span class="t-num">15</span>:
    <span class="t-fn">print</span>(<span class="t-str">"Nice weather for a walk."</span>)
<span class="t-kw">elif</span> temp &gt; <span class="t-num">0</span>:
    <span class="t-fn">print</span>(<span class="t-str">"A bit chilly — bring a jacket."</span>)
<span class="t-kw">else</span>:
    <span class="t-fn">print</span>(<span class="t-str">"It's freezing! Stay inside."</span>)`
      },
      { type:"interactive", id:"cond_demo" },
      { type:"table", title:"Logical operators", headers:["Keyword","Meaning","Example"],
        rows:[
          ["<code>and</code>","Both must be true","<code>age &gt; 0 and age &lt; 120</code>"],
          ["<code>or</code>","At least one true","<code>color == \"red\" or color == \"blue\"</code>"],
          ["<code>not</code>","Flips true/false","<code>not is_raining</code>"],
        ]
      },
      { type:"code", file:"day.py", label:"match statement — cleaner multiple-choice logic",
        code:`day = <span class="t-fn">input</span>(<span class="t-str">"Enter a day: "</span>)

<span class="t-kw">match</span> day:
    <span class="t-kw">case</span> <span class="t-str">"Monday"</span> | <span class="t-str">"Tuesday"</span> | <span class="t-str">"Wednesday"</span> | <span class="t-str">"Thursday"</span> | <span class="t-str">"Friday"</span>:
        <span class="t-fn">print</span>(<span class="t-str">"It's a weekday."</span>)
    <span class="t-kw">case</span> <span class="t-str">"Saturday"</span> | <span class="t-str">"Sunday"</span>:
        <span class="t-fn">print</span>(<span class="t-str">"It's the weekend!"</span>)
    <span class="t-kw">case</span> _:
        <span class="t-fn">print</span>(<span class="t-str">"Unknown day."</span>)`
      },
    ]
  },
  {
    num: 2,
    title: "Loops",
    topics: "while · for · range · break · continue · Nested loops",
    desc: "Loops let you repeat actions without copy-pasting code. Python's <code>while</code> loop repeats as long as a condition is true; the <code>for</code> loop repeats for each item in a sequence.",
    sections: [
      { type:"analogy", text:"A loop is like a washing machine cycle. You don't manually spin the drum — you set it once and it runs until done. Python loops let you repeat code as many times as needed without writing the same lines over and over." },

/* ── RENDER FLOW ── */
function makeFlow(steps) {
  const bw = 100, gap = 32, h = 80, pad = 10;
  const W = steps.length * bw + (steps.length - 1) * gap + pad * 2;
  let s = `<svg class="flow" viewBox="0 0 ${W} ${h}" xmlns="http://www.w3.org/2000/svg" style="width:100%;min-width:${W}px;">`;
  steps.forEach((st, i) => {
    const x = pad + i * (bw + gap);
    const lines = st.l.split('\n');
    s += `<rect x="${x}" y="8" width="${bw}" height="${h-16}" rx="5" fill="${st.fill}"/>`;
    const cy = lines.length === 1 ? 44 : lines.length === 2 ? 37 : 31;
    lines.forEach((ln, li) => {
      s += `<text x="${x+bw/2}" y="${cy+li*15}" text-anchor="middle" font-size="10.5" font-family="system-ui,sans-serif" fill="${st.tc}" font-weight="600">${ln}</text>`;
    });
    if (i < steps.length - 1) {
      const ax = x + bw + 2, bx = ax + gap - 6;
      s += `<line x1="${ax}" y1="${h/2}" x2="${bx}" y2="${h/2}" stroke="#ced4da" stroke-width="1.5"/>`;
      s += `<polygon points="${bx},${h/2-4} ${bx+6},${h/2} ${bx},${h/2+4}" fill="#ced4da"/>`;
    }
  });
  return s + '</svg>';
}

/* ── RENDER LECTURE ── */
function renderLec(lec) {
  let h = `
    <div class="bc">
      <a href="#">CS50P</a><span class="bc-sep">›</span>
      <a href="#">Weeks</a><span class="bc-sep">›</span>
      Week ${lec.num}
    </div>
    <div class="lec-week">Week ${lec.num}</div>
    <h1 class="lec-title"><em>Week ${lec.num}</em> ${lec.title}</h1>
    <div class="lec-topics">${lec.topics}</div>
    <div class="lec-desc">${lec.desc}</div>`;

  lec.sections.forEach(sec => {
    if (sec.type === 'analogy') {
      h += `<div class="analogy"><div class="analogy-label">Real-world analogy</div><p>${sec.text}</p></div>`;
    } else if (sec.type === 'concepts') {
      h += `<div class="section"><div class="section-title">${sec.title}</div><div class="concept-grid">`;
      sec.items.forEach(c => h += `<div class="concept-card"><div class="cc-icon">${c.icon}</div><div class="cc-name">${c.name}</div><div class="cc-desc">${c.desc}</div></div>`);
      h += `</div></div>`;
    } else if (sec.type === 'flow') {
      h += `<div class="section"><div class="section-title">${sec.title}</div><div class="flow-container">${makeFlow(sec.steps)}</div></div>`;
    } else if (sec.type === 'table') {
      h += `<div class="section"><div class="section-title">${sec.title}</div><div class="table-wrap"><table>
        <thead><tr>${sec.headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead>
        <tbody>${sec.rows.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody>
      </table></div></div>`;
    } else if (sec.type === 'code') {
      h += `<div class="section">
        <p class="code-label-text">${sec.label}</p>
        <div class="code-wrap">
          <div class="code-header">
            <div class="code-dot" style="background:#ff5f56"></div>
            <div class="code-dot" style="background:#ffbd2e"></div>
            <div class="code-dot" style="background:#27c93f"></div>
            <span class="code-filename">${sec.file}</span>
          </div>
          <pre class="code-block">${sec.code}</pre>
        </div>
      </div>`;
    } else if (sec.type === 'tips') {
      h += `<div class="section">`;
      sec.items.forEach(t => h += `<div class="tip ${t.k}"><div class="tip-icon">${t.icon}</div><div class="tip-body">${t.html}</div></div>`);
      h += `</div>`;
    } else if (sec.type === 'interactive') {
      h += `<div class="section">${makeInteractive(sec.id)}</div>`;
    }
  });
  return h;
}

/* ── BUILD UI ── */
function build() {
  const nav  = document.getElementById('nav-list');
  const cont = document.getElementById('content');

  lectures.forEach((lec, i) => {
    // nav item
    const ni = document.createElement('div');
    ni.className = 'nav-item' + (i===0?' active':'');
    ni.innerHTML = `<div class="nav-num">${lec.num}</div><div class="nav-text">${lec.title}</div>`;
    ni.onclick = () => {
      document.querySelectorAll('.nav-item').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.lecture').forEach(x=>x.classList.remove('active'));
      ni.classList.add('active');
      document.getElementById('lec'+lec.num).classList.add('active');
      document.getElementById('main-area').scrollTop = 0;
      document.getElementById('prog').style.width = Math.round(((i+1)/lectures.length)*100)+'%';
    };
    nav.appendChild(ni);

    // lecture div
    const d = document.createElement('div');
    d.className = 'lecture'+(i===0?' active':'');
    d.id = 'lec'+lec.num;
    d.innerHTML = renderLec(lec);
    cont.appendChild(d);
  });
}

window.runCond = () => {
  const t = parseInt(document.getElementById('ti').value)||0;
  let branch;
  if(t>30) branch=`if temp > 30:\n    print("It's hot! Stay hydrated.")  # ← this runs`;
  else if(t>15) branch=`elif temp > 15:\n    print("Nice weather for a walk.")  # ← this runs`;
  else if(t>0)  branch=`elif temp > 0:\n    print("A bit chilly — bring a jacket.")  # ← this runs`;
  else          branch=`else:\n    print("It's freezing! Stay inside.")  # ← this runs`;
  document.getElementById('to').textContent = `temp = ${t}\n\n${branch}`;
};

window.runLoop = () => {
  const s=parseInt(document.getElementById('ls').value)||0;
  const e=parseInt(document.getElementById('le').value)||5;
  if(e-s>20){document.getElementById('lo').textContent='Keep the range under 20 items.';return;}
  const vals=[]; for(let i=s;i<e;i++) vals.push(i);
  document.getElementById('lo').textContent=`for i in range(${s}, ${e}):\n    print(i)\n\nOutput: ${vals.join(', ')}`;
};

build();

const mainEl = document.querySelector('.main');
mainEl.id = 'main-area';
mainEl.style.height = 'calc(100vh - 52px)';
mainEl.style.overflowY = 'auto';
